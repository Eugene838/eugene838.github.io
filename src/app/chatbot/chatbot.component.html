<button class="chat-launcher" type="button" (click)="toggleChat()" [attr.aria-expanded]="isOpen" aria-controls="resume-chat">
    <span class="chat-launcher-icon" aria-hidden="true">{{ isOpen ? '&times;' : '&#9993;' }}</span>
    <span>{{ isOpen ? 'Close' : 'Ask about Eugene' }}</span>
</button>

<section *ngIf="isOpen" id="resume-chat" class="chat-panel" aria-label="Resume assistant">
    <header class="chat-header">
        <div>
            <p class="eyebrow">Resume assistant</p>
            <h2>Ask about Eugene</h2>
        </div>
        <span class="status" aria-label="Assistant online"></span>
    </header>

    <div class="chat-messages" aria-live="polite">
        <div *ngFor="let message of messages" class="message" [class.user-message]="message.role === 'user'" [class.assistant-message]="message.role === 'assistant'">
            {{ message.content }}
        </div>
        <div *ngIf="isLoading" class="message assistant-message typing">Thinking...</div>
    </div>

    <form class="chat-form" (ngSubmit)="sendMessage()">
        <label class="sr-only" for="chat-input">Ask a question</label>
        <input id="chat-input" name="question" [(ngModel)]="draft" [disabled]="isLoading" placeholder="Ask about skills or experience" autocomplete="off">
        <button type="submit" [disabled]="isLoading || !draft.trim()" aria-label="Send question">Send</button>
    </form>
</section>
